name: jol

services:
  postgres:
    image: postgis/postgis:16-3.4
    platform: linux/amd64  # image has no arm64 build; runs under emulation on Apple Silicon
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-jol}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-jol_dev_password}
      POSTGRES_DB: ${POSTGRES_DB:-jol}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5433}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-jol} -d ${POSTGRES_DB:-jol}"]
      interval: 3s
      timeout: 3s
      retries: 20

  # Routing engine (Ш-20). Optional: `make up` starts only postgres; use `make valhalla-up`.
  # Tiles are built once from the whole-Kazakhstan extract (kept whole so intercity routing
  # works later) into the named volume `valhalla_data`; the PBF is mounted read-only.
  # Image is pinned by exact tag (multi-arch: native arm64 on Apple Silicon).
  valhalla:
    image: ghcr.io/valhalla/valhalla-scripted:3.9.3
    profiles: ["valhalla"]
    ports:
      - "127.0.0.1:${VALHALLA_PORT:-8002}:8002"
    volumes:
      - valhalla_data:/custom_files
      - ../data/osm/cache/kazakhstan.osm.pbf:/custom_files/kazakhstan.osm.pbf:ro
    environment:
      serve_tiles: "True"
      build_tar: "True"          # tiles packed into one mmap-able tar (fast start, lower RAM)
      build_admins: "True"
      build_time_zones: "False"  # would download a DB from GitHub; not needed for routing
      build_elevation: "False"
      use_default_speeds_config: "False"
      server_threads: "${VALHALLA_THREADS:-4}"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://127.0.0.1:8002/status || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 240
    restart: unless-stopped

  # Local object storage for place photos (Ш-55), dev only. Optional: `make minio-up`.
  # S3-compatible; the admin uploads photos here when STORAGE_PROVIDER=s3. See docs/photos.md.
  # NOT verified on the machine it was written on: Docker Hub pulls were blocked there, so the
  # image tags below were never pulled. If a tag is gone, take a newer one from the MinIO releases.
  minio:
    image: minio/minio:RELEASE.2024-11-07T00-52-20Z
    profiles: ["minio"]
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:-jol_minio}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:-jol_minio_dev_password}
    ports:
      - "127.0.0.1:${MINIO_PORT:-9000}:9000"          # S3 API
      - "127.0.0.1:${MINIO_CONSOLE_PORT:-9001}:9001"  # web console
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 3s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  # One-shot: creates the bucket and lets anyone READ it (photos are public, SSOT §13); writes
  # still need the keys. Running it again is harmless.
  minio-init:
    image: minio/mc:RELEASE.2024-11-05T11-29-45Z
    profiles: ["minio"]
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 $${MINIO_ROOT_USER} $${MINIO_ROOT_PASSWORD} &&
      mc mb --ignore-existing local/$${S3_BUCKET} &&
      mc anonymous set download local/$${S3_BUCKET}"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:-jol_minio}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:-jol_minio_dev_password}
      S3_BUCKET: ${S3_BUCKET:-jol-media}

volumes:
  pgdata:
  valhalla_data:
  miniodata:
