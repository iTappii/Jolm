name: ci

on:
  push:
  pull_request:

jobs:
  server:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: jol
          POSTGRES_PASSWORD: jol_dev_password
          POSTGRES_DB: jol
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U jol -d jol"
          --health-interval 3s --health-timeout 3s --health-retries 20
    env:
      DATABASE_URL: postgresql://jol:jol_dev_password@localhost:5433/jol
      TEST_DATABASE_URL: postgresql://jol:jol_dev_password@localhost:5433/jol_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: server/pyproject.toml
      - run: make ci
