<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="htmx-config" content='{"includeIndicatorStyles": false}'>
  <meta name="robots" content="noindex">
  <title>{% block title %}Админка{% endblock %} — Jol</title>
  <link rel="stylesheet" href="/admin/static/admin.css">
  <script src="/admin/static/htmx-1.9.12.min.js"></script>
  <script src="/admin/static/admin.js" defer></script>
</head>
<body>
{% if session %}
<header class="top">
  <span class="brand">Jol · админка</span>
  <nav>
    <a href="/admin/places">Места</a>
    <a href="/admin/categories">Категории</a>
    <a href="/admin/routes">Маршруты</a>
    <a href="/admin/events">Мероприятия</a>
    <a href="/admin/moderation">Модерация</a>
    <a href="/admin/tariffs">Тарифы</a>
    <a href="/admin/bonuses">Бонусы</a>
  </nav>
  <form method="post" action="/admin/logout">
    <input type="hidden" name="csrf_token" value="{{ csrf }}">
    <span>{{ admin_email }}</span>
    <button class="secondary small" type="submit">Выйти</button>
  </form>
</header>
{% endif %}
<main>
{% block content %}{% endblock %}
</main>
</body>
</html>
