name: Jol
options:
  bundleIdPrefix: kz.jol
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: en
configFiles:
  Debug: Config.xcconfig
  Release: Config.xcconfig
packages:
  MapLibre:
    url: https://github.com/maplibre/maplibre-gl-native-distribution
    exactVersion: 6.31.0
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  Jol:
    type: application
    platform: iOS
    sources: [Jol]
    dependencies:
      - package: MapLibre
        product: MapLibre
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: kz.jol.app
        INFOPLIST_FILE: Jol/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1"
  JolTests:
    type: bundle.unit-test
    platform: iOS
    sources: [JolTests]
    dependencies:
      - target: Jol
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: kz.jol.app.tests
        GENERATE_INFOPLIST_FILE: YES
  JolUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [JolUITests]
    dependencies:
      - target: Jol
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: kz.jol.app.uitests
        GENERATE_INFOPLIST_FILE: YES
schemes:
  Jol:
    build:
      targets:
        Jol: all
    test:
      targets: [JolTests, JolUITests]
